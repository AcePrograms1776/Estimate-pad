<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estimate Pad</title>
<style>
  :root {
    --navy: #1b2a4a;
    --paper: #fdfdfb;
    --ink: #1b1b1b;
    --accent: #f2b134;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--navy);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }
  h1 {
    color: #fff;
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0 0 16px;
  }
  .sheet {
    width: 100%;
    max-width: 640px;
    background: var(--paper);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    padding: 18px;
  }

  /* Letterhead: customer name/email row, street/phone row, city-state-zip row */
  .header-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 8px;
  }
  .header-grid.single { grid-template-columns: 1fr; }
  .field-input {
    border: none;
    border-bottom: 1px solid #ccc;
    border-radius: 0;
    padding: 6px 2px;
    font-size: 1rem;
    font-family: inherit;
    color: var(--ink);
    width: 100%;
    background: transparent;
  }
  .field-input:focus {
    outline: none;
    border-bottom: 1px solid var(--accent);
  }
  .header-gap { height: 14px; }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }
  .toolbar label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 0.75rem;
    color: #555;
  }
  .toolbar .font-field { flex: 2; }
  .toolbar .size-field { flex: 1; }
  .stepper {
    display: flex;
    align-items: stretch;
    border: 1px solid #d8d8d2;
    border-radius: 6px;
    overflow: hidden;
    background: #fff;
  }
  .step-btn {
    flex: 0 0 42px;
    min-width: 42px;
    padding: 0;
    font-size: 1.25rem;
    font-weight: 600;
    line-height: 1;
    background: #f4f2ec;
    color: #444;
    border: none;
    border-radius: 0;
    cursor: pointer;
  }
  .step-btn:active { background: #e6e3da; }
  .step-readout {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
    color: #1b1b1b;
    min-width: 36px;
  }

  .toolbar select,
  .toolbar input[type="number"] {
    padding: 8px;
    font-size: 0.95rem;
    border: 1px solid #d8d8d2;
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    width: 100%;
  }

  textarea {
    width: 100%;
    min-height: 45vh;
    border: none;
    padding: 4px 2px;
    font-size: 1rem;
    line-height: 1.5;
    font-family: inherit;
    color: var(--ink);
    resize: vertical;
    background: transparent;
  }
  textarea:focus {
    outline: none;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 14px;
  }
  button {
    flex: 1 1 calc(50% - 5px);
    min-width: 110px;
    padding: 13px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #1b1b1b;
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }

  .history-toggle {
    width: 100%;
    background: none;
    border: none;
    color: var(--navy);
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: underline;
    padding: 12px 0 0;
    cursor: pointer;
  }
  .history-panel {
    display: none;
    margin-top: 8px;
    border-top: 1px solid #eee;
    padding-top: 6px;
    max-height: 240px;
    overflow-y: auto;
  }
  .history-panel.open { display: block; }
  .history-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0ee;
  }
  .history-item .load-btn {
    flex: 1;
    min-width: 0;
    text-align: left;
    background: none;
    border: none;
    padding: 6px 4px 6px 0;
    font-size: 0.85rem;
    color: var(--ink);
    cursor: pointer;
  }
  .history-item .load-btn .when {
    display: block;
    font-size: 0.72rem;
    color: #888;
    margin-bottom: 2px;
  }
  .history-item .delete-btn {
    flex: 0 0 auto;
    background: #fff;
    border: 1px solid #e0d5d5;
    border-radius: 6px;
    color: #b23b3b;
    font-size: 0.8rem;
    font-weight: 700;
    line-height: 1;
    width: 34px;
    height: 34px;
    margin-left: 10px;
    cursor: pointer;
  }
  .history-item .delete-btn:active { background: #f7eeee; }
  .history-empty {
    color: #888;
    font-size: 0.85rem;
    padding: 8px 0;
  }
  .backup-row {
    display: flex;
    gap: 8px;
    padding: 10px 0 2px;
  }
  .backup-btn {
    flex: 1;
    padding: 8px;
    font-size: 0.8rem;
    font-weight: 600;
    background: #eceae4;
    color: #444;
    border: none;
    border-radius: 5px;
  }
  .version-tag {
    text-align: center;
    font-size: 0.7rem;
    color: #b0aca4;
    padding-top: 14px;
    letter-spacing: 0.05em;
  }

  /* Everything below is invisible on screen; it only shows up when printing. */
  #printView { display: none; }
  .print-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 6px;
  }
  .print-row.single { grid-template-columns: 1fr; }
  .print-cell { white-space: pre-wrap; }
  .print-gap { height: 1.6em; }
  #pv-job { white-space: pre-wrap; margin: 0; font-family: inherit; }

  @media print {
    @page { margin: 0; }
    body { background: #fff; padding: 0; }
    h1, .toolbar, .actions, .history-toggle, .history-panel,
    .header-grid, .header-gap, textarea, .version-tag { display: none; }
    .sheet { box-shadow: none; padding: 0; max-width: 100%; background: #fff; }
    #printView { display: block; position: relative; min-height: 90vh; padding: 0.4in; }
  }
</style>
</head>
<body>
  <h1>Estimate Pad</h1>
  <div class="sheet">

    <!-- Letterhead: name/email, then street/phone, then city-state-zip -->
    <div class="header-grid">
      <input type="text" id="custName" class="field-input" placeholder="Customer name">
      <input type="email" id="custEmail" class="field-input" placeholder="Email address">
    </div>
    <div class="header-grid">
      <input type="text" id="custStreet" class="field-input" placeholder="Street address & house number">
      <input type="tel" id="custPhone" class="field-input" placeholder="Phone number">
    </div>
    <div class="header-grid single">
      <input type="text" id="custCityStateZip" class="field-input" placeholder="City, State ZIP">
    </div>
    <div class="header-gap"></div>

    <div class="toolbar">
      <label class="font-field">Font
        <select id="fontChoice" onchange="updateEstimateStyle()">
          <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" selected>System (Default)</option>
          <option value="Helvetica, sans-serif">Helvetica</option>
          <option value="'Helvetica Neue', Helvetica, sans-serif">Helvetica Neue</option>
          <option value="Arial, sans-serif">Arial</option>
          <option value="'Arial Rounded MT Bold', Arial, sans-serif">Arial Rounded</option>
          <option value="'Times New Roman', Times, serif">Times New Roman</option>
          <option value="Georgia, serif">Georgia</option>
          <option value="Verdana, Geneva, sans-serif">Verdana</option>
          <option value="'Courier New', Courier, monospace">Courier New</option>
          <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
          <option value="Palatino, 'Palatino Linotype', serif">Palatino</option>
          <option value="Baskerville, serif">Baskerville</option>
          <option value="Didot, serif">Didot</option>
          <option value="Futura, sans-serif">Futura</option>
          <option value="Optima, sans-serif">Optima</option>
          <option value="'Gill Sans', 'Gill Sans MT', sans-serif">Gill Sans</option>
          <option value="'American Typewriter', serif">American Typewriter</option>
          <option value="Copperplate, sans-serif">Copperplate</option>
          <option value="Impact, sans-serif">Impact</option>
          <option value="Avenir, 'Avenir Next', sans-serif">Avenir</option>
        </select>
      </label>
      <label class="size-field">Size
        <div class="stepper">
          <button type="button" class="step-btn" onclick="stepSize(-1)">−</button>
          <span class="step-readout" id="sizeReadout">16</span>
          <button type="button" class="step-btn" onclick="stepSize(1)">+</button>
        </div>
        <input type="hidden" id="sizeChoice" value="16">
      </label>
    </div>

    <textarea id="estimateText" placeholder="Job description, trip charges, notes..."></textarea>

    <!-- Print-only mirror of everything above, laid out the same way -->
    <div id="printView">
      <div class="print-row">
        <div class="print-cell" id="pv-name"></div>
        <div class="print-cell" id="pv-email"></div>
      </div>
      <div class="print-row">
        <div class="print-cell" id="pv-street"></div>
        <div class="print-cell" id="pv-phone"></div>
      </div>
      <div class="print-row single">
        <div class="print-cell" id="pv-citystatezip"></div>
      </div>
      <div class="print-gap"></div>
      <pre id="pv-job"></pre>
    </div>

    <div class="actions">
      <button onclick="shareEstimate()" id="shareBtn">Print / Email</button>
      <button onclick="saveEstimate()" id="saveBtn">Save</button>
      <button onclick="copyEstimateText()" id="copyBtn">Copy text</button>
    </div>
    <button class="history-toggle" onclick="toggleHistory()" id="historyToggle">View past estimates</button>
    <div class="history-panel" id="historyPanel">
      <ul id="historyList" style="list-style:none; margin:0; padding:0;"></ul>
      <div class="backup-row">
        <button class="backup-btn" onclick="backupEstimates()" id="backupBtn">Back up all</button>
        <button class="backup-btn" onclick="document.getElementById('restoreFile').click()">Restore</button>
        <input type="file" id="restoreFile"
               style="display:none" onchange="restoreEstimates(this)">
      </div>
    </div>
    <div class="version-tag" id="versionTag"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    var APP_VERSION = '13';
    var STORAGE_KEY = 'estimatePadHistory';

    // Ask the browser to treat this app's saved data as persistent.
    // Reduces (does not eliminate) the chance Safari clears it automatically.
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist();
    }

    // ---- Eastern time, always — regardless of the device's own timezone setting ----
    // Automatically shows EST in winter and EDT in summer, which is correct.
    function easternTimestamp(date) {
      return new Intl.DateTimeFormat('en-US', {
        timeZone: 'America/New_York',
        year: 'numeric', month: 'numeric', day: 'numeric',
        hour: 'numeric', minute: '2-digit',
        timeZoneName: 'short'
      }).format(date);
    }

    // ---- Keep the size box inside 2-98 no matter what gets typed into it ----
    var MIN_SIZE = 2, MAX_SIZE = 98;

    function clampSize(el) {
      var v = parseInt(el.value, 10);
      if (isNaN(v)) { v = 16; }
      if (v < MIN_SIZE) { v = MIN_SIZE; }
      if (v > MAX_SIZE) { v = MAX_SIZE; }
      el.value = v;
      return v;
    }

    // The + and - buttons. Steps by 1 near the small end and by 2 higher up,
    // so getting from 16 to 40 doesn't take twenty-four taps.
    function stepSize(direction) {
      var el = document.getElementById('sizeChoice');
      var v = clampSize(el);
      var jump = (v >= 24) ? 2 : 1;
      v += direction * jump;
      if (v < MIN_SIZE) { v = MIN_SIZE; }
      if (v > MAX_SIZE) { v = MAX_SIZE; }
      el.value = v;
      updateEstimateStyle();
    }

    function updateEstimateStyle() {
      var font = document.getElementById('fontChoice').value;
      var sizeNum = clampSize(document.getElementById('sizeChoice'));
      var size = sizeNum + 'px';
      document.getElementById('sizeReadout').textContent = sizeNum;
      var fields = ['custName', 'custEmail', 'custStreet', 'custPhone',
                     'custCityStateZip', 'estimateText'];
      fields.forEach(function (id) {
        var el = document.getElementById(id);
        el.style.fontFamily = font;
        el.style.fontSize = size;
      });
    }

    // =========================================================================
    // DICTATION-FRIENDLY FORMATTING
    //
    // Everything below runs when you LEAVE a field (tap away / tap the next
    // field), not while you're typing or speaking. Rewriting text mid-sentence
    // is what was breaking dictation before — iOS kept losing its place.
    // Now you can dictate the whole thing freely, and it gets tidied up after.
    // =========================================================================

    function onFinish(el, formatter) {
      function apply() {
        var before = el.value;
        var after = formatter(before);
        if (after !== before) { el.value = after; }
      }
      el.addEventListener('blur', apply);
      el.addEventListener('change', apply);
    }

    // ---- Capitalize the first letter of every word (name, street) ----
    function capitalizeWords(text) {
      return text.replace(/(^|\s)([a-z])/g, function (m, sep, letter) {
        return sep + letter.toUpperCase();
      });
    }

    // ---- Capitalize just the very first letter ----
    function capitalizeFirst(text) {
      if (!text.length) { return text; }
      return text.charAt(0).toUpperCase() + text.slice(1);
    }

    // ---- SRQ and FL always fully capitalized ----
    function forceCaps(text) {
      return text.replace(/\bsrq\b/gi, 'SRQ').replace(/\bfl\b/gi, 'FL');
    }

    // ---- EMAIL: turns spoken words into real email punctuation ----
    // "jake friedman at yahoo dot com"  ->  "Jakefriedman@yahoo.com"
    function formatEmail(text) {
      // Dictation likes to capitalize words it thinks start sentences —
      // flatten everything first, then capitalize only the very first letter.
      var t = text.trim().toLowerCase();

      // Spoken symbol words -> actual symbols
      t = t.replace(/\s*\b(at sign|at symbol|at)\b\s*/gi, '@');
      t = t.replace(/\s*\b(dot|period|point)\b\s*/gi, '.');
      t = t.replace(/\s*\b(underscore|under score)\b\s*/gi, '_');
      t = t.replace(/\s*\b(dash|hyphen|minus)\b\s*/gi, '-');
      t = t.replace(/\s*\b(plus)\b\s*/gi, '+');

      // Dictation sometimes inserts these on its own
      t = t.replace(/\s*@\s*/g, '@');
      t = t.replace(/\s*\.\s*/g, '.');

      // An email never contains spaces
      t = t.replace(/\s+/g, '');

      // Strip stray punctuation dictation likes to add at the end
      t = t.replace(/[.,;:]+$/, '');

      // Collapse accidental doubles
      t = t.replace(/\.{2,}/g, '.').replace(/@{2,}/g, '@');

      return capitalizeFirst(t);
    }

    // ---- PHONE: any spoken or typed digits -> XXX-XXX-XXXX ----
    function formatPhone(text) {
      var digits = text.replace(/\D/g, '');
      if (digits.length === 11 && digits.charAt(0) === '1') {
        digits = digits.slice(1);
      }
      digits = digits.slice(0, 10);
      if (digits.length > 6) {
        return digits.slice(0, 3) + '-' + digits.slice(3, 6) + '-' + digits.slice(6);
      }
      if (digits.length > 3) {
        return digits.slice(0, 3) + '-' + digits.slice(3);
      }
      return digits;
    }

    // ---- CITY / STATE / ZIP ----
    // "sarasota florida 34235"  ->  "Sarasota, FL  34235"
    var STATE_NAMES = {
      'alabama': 'AL', 'alaska': 'AK', 'arizona': 'AZ', 'arkansas': 'AR',
      'california': 'CA', 'colorado': 'CO', 'connecticut': 'CT', 'delaware': 'DE',
      'florida': 'FL', 'georgia': 'GA', 'hawaii': 'HI', 'idaho': 'ID',
      'illinois': 'IL', 'indiana': 'IN', 'iowa': 'IA', 'kansas': 'KS',
      'kentucky': 'KY', 'louisiana': 'LA', 'maine': 'ME', 'maryland': 'MD',
      'massachusetts': 'MA', 'michigan': 'MI', 'minnesota': 'MN',
      'mississippi': 'MS', 'missouri': 'MO', 'montana': 'MT', 'nebraska': 'NE',
      'nevada': 'NV', 'new hampshire': 'NH', 'new jersey': 'NJ',
      'new mexico': 'NM', 'new york': 'NY', 'north carolina': 'NC',
      'north dakota': 'ND', 'ohio': 'OH', 'oklahoma': 'OK', 'oregon': 'OR',
      'pennsylvania': 'PA', 'rhode island': 'RI', 'south carolina': 'SC',
      'south dakota': 'SD', 'tennessee': 'TN', 'texas': 'TX', 'utah': 'UT',
      'vermont': 'VT', 'virginia': 'VA', 'washington': 'WA',
      'west virginia': 'WV', 'wisconsin': 'WI', 'wyoming': 'WY',
      'district of columbia': 'DC'
    };

    var STATE_CODES = ['AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA','HI','ID','IL','IN',
      'IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY',
      'NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY','DC'];

    function formatCityStateZip(text) {
      var t = text.trim();
      if (!t) { return t; }

      // Dictation reads zips as "3 4 2 3 5" — close those gaps
      t = t.replace(/(\d)\s+(?=\d)/g, '$1');

      // Full spoken state names -> two-letter code
      Object.keys(STATE_NAMES).forEach(function (name) {
        var re = new RegExp('(^|[\\s,])' + name + '(?=[\\s,]|$)', 'i');
        t = t.replace(re, '$1' + STATE_NAMES[name]);
      });

      t = forceCaps(t);

      // Split into City / ST / ZIP and rebuild with exact spacing
      var m = t.match(/^(.*?)[\s,]+([A-Za-z]{2})[\s,]+(\d{5}(?:-\d{4})?)\s*$/);
      if (m && STATE_CODES.indexOf(m[2].toUpperCase()) !== -1) {
        return capitalizeWords(m[1].trim()) + ', ' + m[2].toUpperCase() + '  ' + m[3];
      }

      // Not a complete address yet — capitalize what's there and leave it alone
      return capitalizeFirst(t);
    }

    // ---- SPOKEN SHORTCUTS for the job description ----
    // Say these words while dictating and they turn into symbols and labels
    // when you tap out of the box:
    //
    //   "skip a line" -> a blank line      "plus"     -> +
    //   "material"    -> Mat:              "labor"    -> Labor:
    //   "subtotal"    -> Subtotal:         "total"    -> Total:
    //
    // Each label ignores itself if the colon is already there, so tapping in
    // and out of the box repeatedly never turns Total: into Total::
    function formatJobText(text) {
      var t = text;

      // Blank line. Eats the spaces around it so lines butt up cleanly.
      t = t.replace(/[ \t]*\bskip a line\b[ \t]*/gi, '\n\n');
      t = t.replace(/[ \t]*\bskip line\b[ \t]*/gi, '\n\n');

      t = t.replace(/\bplus\b/gi, '+');

      // Longest label first so "subtotal" is never mistaken for "total".
      t = t.replace(/\bsubtotal\b(?!\s*:)/gi, 'Subtotal:');
      t = t.replace(/\btotal\b(?!\s*:)/gi, 'Total:');
      t = t.replace(/\bmaterials?\b(?!\s*:)/gi, 'Mat:');
      t = t.replace(/\blabou?r\b(?!\s*:)/gi, 'Labor:');

      return t;
    }

    // ---- "next box" moves to the following field ----
    //
    // Why not "next line"? iOS dictation swallows that phrase and turns it into
    // a full stop before this code ever sees it, which is why it was dropping a
    // "." instead of moving on. "next box" comes through as plain words, so it
    // can actually be acted on.
    //
    // This lets you dictate the whole letterhead in one breath:
    //   "Bob Friedman next box bob at srqace dot com next box 3848 prado dr
    //    next box 941 894 2720 next box sarasota florida 34235"
    // Each piece drops into its own box when you tap away.
    var FIELD_ORDER = ['custName', 'custEmail', 'custStreet',
                       'custPhone', 'custCityStateZip', 'estimateText'];
    var NEXT_FIELD_RE = /\s*\b(?:next box|next field|next line|next one)\b\s*/gi;
    var distributing = false;

    function attachFieldSplit(el) {
      function run() {
        if (distributing) { return; }

        NEXT_FIELD_RE.lastIndex = 0;
        if (!NEXT_FIELD_RE.test(el.value)) { return; }

        NEXT_FIELD_RE.lastIndex = 0;
        var parts = el.value.split(NEXT_FIELD_RE);

        var startAt = FIELD_ORDER.indexOf(el.id);
        if (startAt === -1) { return; }

        var lastIndex = FIELD_ORDER.length - 1;
        var touched = [];

        distributing = true;
        parts.forEach(function (part, i) {
          var at = startAt + i;
          var piece = part.trim();

          if (at < lastIndex) {
            document.getElementById(FIELD_ORDER[at]).value = piece;
            if (touched.indexOf(FIELD_ORDER[at]) === -1) {
              touched.push(FIELD_ORDER[at]);
            }
          } else {
            // Anything past the last box piles into the job description
            if (!piece) { return; }
            var box = document.getElementById(FIELD_ORDER[lastIndex]);
            box.value = (at === lastIndex) ? piece : (box.value + '\n' + piece);
            if (touched.indexOf(FIELD_ORDER[lastIndex]) === -1) {
              touched.push(FIELD_ORDER[lastIndex]);
            }
          }
        });
        distributing = false;

        // Let each box that just changed tidy itself
        touched.forEach(function (id) {
          document.getElementById(id).dispatchEvent(new Event('change'));
        });
      }

      el.addEventListener('blur', run);
      el.addEventListener('change', run);
    }

    // ---- Right-arrow-to-next-field, only when the cursor is already at the end ----
    function advanceOnRightArrow(fromEl, toEl) {
      fromEl.addEventListener('keydown', function (e) {
        var atEnd = fromEl.selectionStart === fromEl.value.length &&
                    fromEl.selectionEnd === fromEl.value.length;
        if (e.key === 'ArrowRight' && atEnd) {
          e.preventDefault();
          toEl.focus();
          var len = toEl.value.length;
          if (typeof toEl.setSelectionRange === 'function') {
            toEl.setSelectionRange(len, len);
          }
        }
      });
    }

    // ---- Force every field to tidy itself, even if still focused ----
    function tidyAllFields() {
      ['custName', 'custEmail', 'custStreet', 'custPhone', 'custCityStateZip',
       'estimateText']
        .forEach(function (id) {
          document.getElementById(id).dispatchEvent(new Event('change'));
        });
    }

    function fillPrintView() {
      tidyAllFields();
      var font = document.getElementById('fontChoice').value;
      var size = clampSize(document.getElementById('sizeChoice')) + 'px';

      document.getElementById('pv-name').textContent = document.getElementById('custName').value;
      document.getElementById('pv-email').textContent = document.getElementById('custEmail').value;
      document.getElementById('pv-street').textContent = document.getElementById('custStreet').value;
      document.getElementById('pv-phone').textContent = document.getElementById('custPhone').value;
      document.getElementById('pv-citystatezip').textContent = document.getElementById('custCityStateZip').value;
      document.getElementById('pv-job').textContent = document.getElementById('estimateText').value;

      var printView = document.getElementById('printView');
      printView.style.fontFamily = font;
      printView.style.fontSize = size;
    }

    // Maps your chosen screen font to the closest font built into PDFs.
    // PDFs only guarantee three: a plain one, a serif one, and a typewriter one.
    function pdfFontFor(cssFont) {
      var f = (cssFont || '').toLowerCase();
      if (f.indexOf('courier') !== -1 || f.indexOf('monospace') !== -1) {
        return 'courier';
      }
      var serifs = ['times', 'georgia', 'palatino', 'baskerville', 'didot',
                    'american typewriter'];
      for (var i = 0; i < serifs.length; i++) {
        if (f.indexOf(serifs[i]) !== -1) { return 'times'; }
      }
      return 'helvetica';
    }

    // Builds the PDF by WRITING REAL TEXT into it — not by photographing the
    // screen. That keeps the words selectable, copyable and searchable, makes
    // the file much smaller, and keeps it sharp at any zoom.
    function buildPdfBlob() {
      if (!window.jspdf) {
        throw new Error('the PDF tool did not load — check your internet connection');
      }
      tidyAllFields();

      var jsPDFCtor = window.jspdf.jsPDF;
      var pdf = new jsPDFCtor({ unit: 'pt', format: 'letter' });

      var pageW = pdf.internal.pageSize.getWidth();
      var pageH = pdf.internal.pageSize.getHeight();
      var margin = 54;                       // 0.75 inch all round
      var contentW = pageW - margin * 2;
      var gutter = 18;
      var colW = (contentW - gutter) / 2;
      var rightX = margin + colW + gutter;

      // Screen sizes are in pixels; PDFs use points (72 to the inch).
      var sizePt = Math.max(4, Math.round(
        clampSize(document.getElementById('sizeChoice')) * 0.75
      ));
      var lineH = sizePt * 1.45;

      pdf.setFont(pdfFontFor(document.getElementById('fontChoice').value), 'normal');
      pdf.setFontSize(sizePt);

      var y = margin + sizePt;

      function newPageIfNeeded() {
        if (y > pageH - margin) {
          pdf.addPage();
          y = margin + sizePt;
        }
      }

      // ---- Letterhead: two columns per row ----
      function letterheadRow(leftText, rightText) {
        var l = leftText ? pdf.splitTextToSize(leftText, colW) : [];
        var r = rightText ? pdf.splitTextToSize(rightText, colW) : [];
        var rows = Math.max(l.length, r.length);
        if (rows === 0) { return; }

        newPageIfNeeded();
        if (l.length) { pdf.text(l, margin, y); }
        if (r.length) { pdf.text(r, rightX, y); }
        y += rows * lineH;
      }

      letterheadRow(
        document.getElementById('custName').value,
        document.getElementById('custEmail').value
      );
      letterheadRow(
        document.getElementById('custStreet').value,
        document.getElementById('custPhone').value
      );
      letterheadRow(
        document.getElementById('custCityStateZip').value,
        ''
      );

      // ---- Blank line, then the job description ----
      y += lineH;

      var job = document.getElementById('estimateText').value || '';
      job.split('\n').forEach(function (rawLine) {
        if (rawLine.trim() === '') {
          y += lineH;                        // preserve blank lines
          return;
        }
        pdf.splitTextToSize(rawLine, contentW).forEach(function (line) {
          newPageIfNeeded();
          pdf.text(line, margin, y);
          y += lineH;
        });
      });

      return pdf.output('blob');
    }

    // =========================================================================
    // SHARING (Print / Email / Back up) — one tap each.
    //
    // Building the PDF is instant now, so the file is ready in the same instant
    // you tap. That matters: phones only allow the share sheet to open as the
    // direct result of a tap, which is why this used to need two.
    // =========================================================================

    function downloadFile(file) {
      var url = URL.createObjectURL(file);
      var a = document.createElement('a');
      a.href = url;
      a.download = file.name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    }

    function canShareFile(file) {
      return !!(navigator.canShare && navigator.canShare({ files: [file] }));
    }

    function estimateFileName() {
      var namePart = (document.getElementById('custName').value || 'estimate')
        .trim().replace(/\s+/g, '_');
      return namePart + '.pdf';
    }

    function buildEstimateFile() {
      var blob = buildPdfBlob();
      return new File([blob], estimateFileName(), { type: 'application/pdf' });
    }

    // ONE button for both. On a phone or tablet this opens the share sheet,
    // which carries Print, Mail, Messages and Save to Files together. On a
    // computer it opens the PDF in its own tab, where the viewer's own
    // print and download buttons cover the same ground.
    function shareEstimate() {
      var file;
      try {
        file = buildEstimateFile();
      } catch (err) {
        alert('Could not create the PDF: ' + err.message);
        return;
      }

      if (canShareFile(file)) {
        navigator.share({ files: [file], title: 'Estimate' }).catch(function (err) {
          if (err && err.name !== 'AbortError') { openPdf(file); }
        });
      } else {
        openPdf(file);
      }
    }

    function openPdf(file) {
      var url = URL.createObjectURL(file);
      var win = window.open(url, '_blank');
      if (!win) {
        downloadFile(file);
        alert('Your browser blocked the new tab, so the PDF was downloaded instead.');
      }
    }

    // Plain-text version of the estimate — for pasting straight into an email
    // body. Unlike a PDF file, text pastes anywhere.
    function estimateAsText() {
      tidyAllFields();
      var lines = [
        document.getElementById('custName').value,
        document.getElementById('custEmail').value,
        document.getElementById('custStreet').value,
        document.getElementById('custPhone').value,
        document.getElementById('custCityStateZip').value
      ].filter(function (v) { return v && v.trim(); });

      var job = document.getElementById('estimateText').value;
      if (job && job.trim()) {
        lines.push('');
        lines.push(job);
      }
      return lines.join('\n');
    }

    function flashCopied() {
      var btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied \u2713';
      setTimeout(function () { btn.textContent = 'Copy text'; }, 1200);
    }

    function copyEstimateText() {
      var text = estimateAsText();
      if (!text) { return; }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(flashCopied, function () {
          legacyCopy(text);
        });
      } else {
        legacyCopy(text);
      }
    }

    // Older browsers (and some locked-down ones) need the select-and-copy trick
    function legacyCopy(text) {
      var box = document.createElement('textarea');
      box.value = text;
      box.style.position = 'fixed';
      box.style.left = '-9999px';
      document.body.appendChild(box);
      box.focus();
      box.select();
      try {
        document.execCommand('copy');
        flashCopied();
      } catch (e) {
        alert('Copying is blocked in this browser. Select the text by hand instead.');
      }
      document.body.removeChild(box);
    }

    // =========================================================================
    // SAVED ESTIMATES
    // =========================================================================

    function loadHistory() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveHistoryArray(list) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      } catch (e) {
        alert('Could not save. Your device storage may be full.');
      }
    }

    function saveEstimate() {
      tidyAllFields();

      var job = document.getElementById('estimateText').value;
      var name = document.getElementById('custName').value;
      var email = document.getElementById('custEmail').value;
      var street = document.getElementById('custStreet').value;
      var phone = document.getElementById('custPhone').value;
      var cityStateZip = document.getElementById('custCityStateZip').value;

      var hasContent = [job, name, email, street, phone, cityStateZip].some(
        function (v) { return v && v.trim(); }
      );
      if (!hasContent) { return; }

      var history = loadHistory();
      history.unshift({
        id: Date.now(),
        when: easternTimestamp(new Date()),
        name: name,
        email: email,
        street: street,
        phone: phone,
        cityStateZip: cityStateZip,
        job: job,
        font: document.getElementById('fontChoice').value,
        size: document.getElementById('sizeChoice').value
      });
      saveHistoryArray(history);
      renderHistory();

      var btn = document.getElementById('saveBtn');
      btn.textContent = 'Saved \u2713';
      setTimeout(function () { btn.textContent = 'Save'; }, 1200);
    }

    function renderHistory() {
      var history = loadHistory();
      document.getElementById('historyToggle').textContent =
        'View past estimates (' + history.length + ')';

      var list = document.getElementById('historyList');
      list.innerHTML = '';

      if (history.length === 0) {
        list.innerHTML = '<li class="history-empty">Nothing saved yet.</li>';
        return;
      }

      history.forEach(function (entry) {
        var li = document.createElement('li');
        li.className = 'history-item';

        var label = (entry.name && entry.name.trim()) ? entry.name : '(no name)';
        var jobPreview = (entry.job || '').slice(0, 40).replace(/\n/g, ' ');

        var loadBtn = document.createElement('button');
        loadBtn.className = 'load-btn';
        loadBtn.onclick = function () { loadEstimate(entry.id); };
        var whenSpan = document.createElement('span');
        whenSpan.className = 'when';
        whenSpan.textContent = entry.when;
        loadBtn.appendChild(whenSpan);
        loadBtn.appendChild(document.createTextNode(
          label + (jobPreview ? ' \u2014 ' + jobPreview : '')
        ));

        var delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = '\u2715';
        delBtn.onclick = function () { deleteEstimate(entry.id); };

        li.appendChild(loadBtn);
        li.appendChild(delBtn);
        list.appendChild(li);
      });
    }

    function loadEstimate(id) {
      var entry = loadHistory().find(function (e) { return e.id === id; });
      if (!entry) { return; }
      document.getElementById('custName').value = entry.name || '';
      document.getElementById('custEmail').value = entry.email || '';
      document.getElementById('custStreet').value = entry.street || '';
      document.getElementById('custPhone').value = entry.phone || '';
      document.getElementById('custCityStateZip').value = entry.cityStateZip || '';
      document.getElementById('estimateText').value = entry.job || '';
      document.getElementById('fontChoice').value = entry.font;
      document.getElementById('sizeChoice').value = parseInt(entry.size, 10) || 16;
      updateEstimateStyle();
      document.getElementById('historyPanel').classList.remove('open');
    }

    function deleteEstimate(id) {
      var all = loadHistory();
      var entry = all.find(function (e) { return e.id === id; });
      if (!entry) { return; }

      // Ask before deleting — a stray tap should never lose an estimate.
      var label = (entry.name && entry.name.trim()) ? entry.name : 'this estimate';
      if (!confirm('Delete ' + label + '?\n\nThis cannot be undone.')) { return; }

      saveHistoryArray(all.filter(function (e) { return e.id !== id; }));
      renderHistory();
    }

    function toggleHistory() {
      document.getElementById('historyPanel').classList.toggle('open');
    }

    // =========================================================================
    // BACKUP & RESTORE
    //
    // The backup file is a clean, readable list and nothing else. The layout is
    // regular enough that Restore can read it straight back, so there's no
    // block of code tacked on the end.
    // =========================================================================

    var BACKUP_RULE = '------------------------------------------------';
    var BACKUP_HEADER_RE = /^ESTIMATE\s+\d+\s+[\u2014-]+\s+saved\s+(.*)$/;
    var DEFAULT_FONT = "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";

    // Every backup gets its own name: the app version that made it, plus the
    // date AND time. Two backups can never share a name, so your phone stops
    // adding " 2" and " 3" — and you can always tell which file is newest.
    function backupFileName() {
      var parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'America/New_York',
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: false
      }).formatToParts(new Date());

      var get = function (t) {
        var p = parts.find(function (x) { return x.type === t; });
        return p ? p.value : '00';
      };

      return 'estimate-backup-v' + APP_VERSION + '-' +
             get('year') + '-' + get('month') + '-' + get('day') + '-' +
             get('hour') + get('minute') + '.txt';
    }

    function buildBackupFile() {
      var history = loadHistory();
      if (history.length === 0) {
        throw new Error('there are no saved estimates to back up yet');
      }

      var out = [];
      history.forEach(function (e, i) {
        if (i > 0) { out.push(''); out.push(''); }
        out.push('ESTIMATE ' + (i + 1) + '  \u2014  saved ' + (e.when || 'unknown'));
        out.push(BACKUP_RULE);
        // Always five lines here, blank if unused, so Restore can find them.
        out.push(e.name || '');
        out.push(e.email || '');
        out.push(e.street || '');
        out.push(e.phone || '');
        out.push(e.cityStateZip || '');
        out.push('');
        out.push(e.job || '');
      });

      var blob = new Blob([out.join('\n')], { type: 'text/plain' });
      return new File([blob], backupFileName(), { type: 'text/plain' });
    }

    function backupEstimates() {
      var file;
      try {
        file = buildBackupFile();
      } catch (err) {
        alert('Could not create the backup: ' + err.message);
        return;
      }

      if (canShareFile(file)) {
        navigator.share({ files: [file], title: 'Estimate Backup' }).catch(function (err) {
          if (err && err.name !== 'AbortError') { downloadFile(file); }
        });
      } else {
        downloadFile(file);
      }
    }

    // Gives the same estimate the same id every time, so restoring a file
    // twice doesn't create duplicates.
    function idFor(when, name, job) {
      var s = when + '|' + name + '|' + job;
      var h = 0;
      for (var i = 0; i < s.length; i++) {
        h = ((h << 5) - h) + s.charCodeAt(i);
        h = h & h;
      }
      return Math.abs(h);
    }

    function parseBackupText(text) {
      var trimmed = text.trim();

      // Oldest backups were pure code — still readable.
      if (trimmed.charAt(0) === '[') {
        try { return JSON.parse(trimmed); } catch (e) { /* fall through */ }
      }

      // The in-between version kept its code below a marker line.
      var markerAt = text.indexOf('DO NOT EDIT ANYTHING BELOW THIS LINE');
      if (markerAt !== -1) {
        var tail = text.slice(markerAt);
        var listAt = tail.indexOf('[');
        if (listAt !== -1) {
          try { return JSON.parse(tail.slice(listAt)); } catch (e) { /* fall through */ }
        }
      }

      // Current format: read the clean list itself.
      var lines = text.split('\n');
      var found = [];
      var i = 0;

      while (i < lines.length) {
        var head = lines[i].match(BACKUP_HEADER_RE);
        if (!head) { i++; continue; }

        var when = head[1].trim();
        i++;
        if (i < lines.length && /^-{3,}$/.test(lines[i].trim())) { i++; }

        var f = [];
        for (var k = 0; k < 5; k++) {
          f.push(i < lines.length ? lines[i].trim() : '');
          i++;
        }

        if (i < lines.length && lines[i].trim() === '') { i++; }

        var jobLines = [];
        while (i < lines.length && !BACKUP_HEADER_RE.test(lines[i])) {
          jobLines.push(lines[i]);
          i++;
        }
        while (jobLines.length && jobLines[jobLines.length - 1].trim() === '') {
          jobLines.pop();
        }

        found.push({
          id: idFor(when, f[0], jobLines.join('\n')),
          when: when,
          name: f[0],
          email: f[1],
          street: f[2],
          phone: f[3],
          cityStateZip: f[4],
          job: jobLines.join('\n'),
          font: DEFAULT_FONT,
          size: '16'
        });
      }

      return found;
    }

    // ---- Restore: read a backup file back in, keeping anything already here ----
    function restoreEstimates(input) {
      var file = input.files && input.files[0];
      if (!file) { return; }

      var reader = new FileReader();

      reader.onerror = function () {
        alert('That file could not be opened.');
        input.value = '';
      };

      reader.onload = function () {
        try {
          var incoming = parseBackupText(reader.result);
          if (!Array.isArray(incoming) || incoming.length === 0) {
            throw new Error('nothing found in that file');
          }

          var existing = loadHistory();
          var seen = {};
          existing.forEach(function (e) { seen[e.id] = true; });

          var added = 0;
          incoming.forEach(function (e) {
            if (e && e.id && !seen[e.id]) {
              existing.push(e);
              seen[e.id] = true;
              added++;
            }
          });

          existing.sort(function (a, b) { return b.id - a.id; });
          saveHistoryArray(existing);
          renderHistory();
          alert('Restored ' + added + ' estimate(s).');
        } catch (e) {
          alert('That file is not an estimate backup.');
        }
        input.value = '';
      };

      reader.readAsText(file);
    }

    // ---- Wire everything up ----
    var elName = document.getElementById('custName');
    var elEmail = document.getElementById('custEmail');
    var elStreet = document.getElementById('custStreet');
    var elPhone = document.getElementById('custPhone');
    var elCityStateZip = document.getElementById('custCityStateZip');
    var elJob = document.getElementById('estimateText');

    advanceOnRightArrow(elName, elEmail);
    advanceOnRightArrow(elEmail, elStreet);
    advanceOnRightArrow(elStreet, elPhone);
    advanceOnRightArrow(elPhone, elCityStateZip);
    advanceOnRightArrow(elCityStateZip, elJob);

    // Registered first, so text is distributed before each box formats itself
    FIELD_ORDER.forEach(function (id) {
      attachFieldSplit(document.getElementById(id));
    });

    onFinish(elName, capitalizeWords);
    onFinish(elEmail, formatEmail);
    onFinish(elStreet, function (t) { return forceCaps(capitalizeWords(t)); });
    onFinish(elPhone, formatPhone);
    onFinish(elCityStateZip, formatCityStateZip);
    onFinish(elJob, formatJobText);

    document.getElementById('versionTag').textContent = 'VERSION ' + APP_VERSION;
    renderHistory();
    updateEstimateStyle();
  </script>
</body>
</html>
